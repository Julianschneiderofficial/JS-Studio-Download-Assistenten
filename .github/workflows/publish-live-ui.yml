name: Publish live manager interface

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - .github/workflows/publish-live-ui.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published interface
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and verify the interface
        run: npm ci && npm test
      - name: Prepare the live site and publication information
        shell: bash
        env:
          CHANGE_MESSAGE: ${{ github.event.head_commit.message }}
          PUBLISHED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          node -e "const fs=require('fs');const info={commit:process.env.GITHUB_SHA,publishedAt:process.env.PUBLISHED_AT||new Date().toISOString(),change:(process.env.CHANGE_MESSAGE||'Neue Manager-Oberfläche').split(/\r?\n/,1)[0].slice(0,300)};fs.writeFileSync('_site/build-info.json',JSON.stringify(info,null,2)+'\n')"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload live manager interface
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy live manager interface
        id: deployment
        uses: actions/deploy-pages@v4
